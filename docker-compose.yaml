services:
  oracle-db:
    image: gvenzl/oracle-xe:21-slim
    ports:
      - "${ORACLE_HOST_PORT:-1521}:1521"
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:-YourStrongPassword123!}
      ORACLE_DATABASE: ${DB_SERVICE_NAME:-job_board_pdb}
      APP_USER: ${DB_USERNAME:-job_board_user}
      APP_USER_PASSWORD: ${DB_PASSWORD:-jobpassword}
    volumes:
      - oracle_data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 15m
    restart: unless-stopped

  api:
    build: .
    image: jobboard-api:dev
    depends_on:
      oracle-db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: oracle-db
      DB_PORT: "1521"
      DB_SYNCHRONIZE: ${DB_SYNCHRONIZE:-true}
      PORT: "3002"
    ports:
      - "3002:3002"     
    volumes:
      - uploads_data:/app/uploads
    restart: unless-stopped

volumes:
  oracle_data:
  uploads_data: